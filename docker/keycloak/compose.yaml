# Local-only Keycloak for developing the admin panel's staff login.
#
# This is a DEVELOPMENT MIRROR. The source of truth for the real realm is
# `docs/keycloak-setup.md`; see `docs/local-keycloak.md` for how the two relate
# and where this file deliberately differs.
#
#   docker compose -f docker/keycloak/compose.yaml up -d
#
# Nothing here may ever be pointed at a production database or a public host.
name: koala-admin-keycloak

services:
  keycloak-db:
    # Keycloak gets its OWN database. It never shares Koala's
    # (docs/keycloak-setup.md §1); the compose project name above keeps the
    # volume separate from every other Postgres on this machine.
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      # Local container, no published port — this password reaches nothing.
      POSTGRES_PASSWORD: local-dev-only
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    # Deliberately no `ports:` — only Keycloak talks to it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    # Pinned, never `latest` (docs/keycloak-setup.md §1). Bump this
    # deliberately, together with the version running in Dokploy.
    image: quay.io/keycloak/keycloak:26.7.3
    depends_on:
      keycloak-db:
        condition: service_healthy
    # `start-dev` is the one intentional divergence from the production spec,
    # which mandates `start`. Production mode refuses to serve plain HTTP, and
    # the whole point of this container is `http://localhost`. Everything the
    # panel actually depends on — realm, roles, client, mappers, lifespans — is
    # imported from the realm file, not implied by the mode.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: local-dev-only
      # Console credentials for this throwaway container only.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      # 8080 on the host belongs to the Koala backend, so publish on 8085.
      # The issuer the panel uses is therefore http://localhost:8085/realms/koala-staff.
      - "8085:8080"
      # Management port: /health/ready lives here in Keycloak 26.
      - "9005:9000"
    volumes:
      - ./import:/opt/keycloak/data/import:ro
    healthcheck:
      # The image ships no curl or wget, so probe the management port with
      # bash's /dev/tcp. `CMD` (not `CMD-SHELL`) because /bin/sh has no
      # /dev/tcp.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  keycloak-db-data:
